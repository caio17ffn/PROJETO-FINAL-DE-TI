{% extends "base.html" %}
{% block conteudo %}
<h2>Pacientes</h2>

<form action="/pacientes/novo" method="POST">
  <input name="nome" placeholder="Nome" required>
  <input name="telefone" placeholder="Telefone">
  <input type="date" name="nascimento">
  <button type="submit">Cadastrar</button>
</form>

<table>
  <tr><th>Nome</th><th>Telefone</th><th>Ações</th></tr>
  {% for p in pacientes %}
  <tr>
    <td>{{ p.nome }}</td>
    <td>{{ p.telefone }}</td>
    <td><a href="/pacientes/{{ p.id }}/excluir">Excluir</a></td>
  </tr>
  {% else %}
  <tr><td colspan="3">Nenhum paciente cadastrado.</td></tr>
  {% endfor %}
</table>
{% endblock %}
